<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Work Clip Board</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clip Board" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="stylesheet" href="clip.css" />
</head>
<body>

  <!-- Header -->
  <div class="topbar">
    <div class="topbar-left">
      <h1>Work Clip Board</h1>
      <div class="subtitle">Paste work content &rarr; auto-syncs to Mac mini</div>
    </div>
    <div class="topbar-right">
      <span id="sync-status" class="sync-dot" title="Checking connection..."></span>
      <a href="index.html" class="btn btn-ghost">Kanban</a>
      <a href="badges.html" class="btn btn-ghost">Badge Tracker</a>
      <a href="sheets.html" class="btn btn-ghost">Sheets</a>
      <a href="outstanding.html" class="btn btn-ghost">Outstanding</a>
      <a href="poker.html" class="btn btn-ghost">Poker</a>
      <a href="dashboards.html" class="btn btn-ghost">Dev</a>
      <button id="signOutBtn" class="btn btn-ghost">Sign Out</button>
    </div>
  </div>

  <!-- Main layout -->
  <div class="main">

    <!-- Left: Paste form -->
    <div class="panel form-panel">
      <h2 class="panel-title">New Clip</h2>

      <div class="field">
        <label for="project-select">Project</label>
        <select id="project-select" class="form-select">
          <option value="">Loading projects…</option>
        </select>
      </div>

      <div class="field">
        <label>Type</label>
        <div class="type-buttons">
          <button class="type-btn active" data-type="meetings">Meetings</button>
          <button class="type-btn" data-type="email">Email</button>
          <button class="type-btn" data-type="slack">Slack</button>
          <button class="type-btn" data-type="teams">Teams</button>
          <button class="type-btn" data-type="documents">Documents</button>
        </div>
      </div>

      <div class="field">
        <label for="clip-title">Title <span style="color:var(--muted);font-weight:400">(auto-filled from filename if blank)</span></label>
        <input type="text" id="clip-title" class="form-input" placeholder="Required only when pasting content" />
      </div>

      <div class="field">
        <label for="clip-content">Content</label>
        <textarea id="clip-content" class="form-textarea" placeholder="Paste your Slack message, email, or notes here…"></textarea>
      </div>

      <div class="field">
        <label>Destination</label>
        <div class="type-buttons">
          <button class="dest-btn active" data-dest="new">New File</button>
          <button class="dest-btn" data-dest="current">Current File</button>
        </div>
      </div>

      <div class="field">
        <label>Attachments</label>
        <div id="drop-zone" class="drop-zone">
          <div class="drop-zone-inner">
            <span class="drop-icon">&#128206;</span>
            <span>Drag &amp; drop files here, or</span>
            <label class="btn btn-ghost btn-sm" style="cursor:pointer">
              Browse
              <input type="file" id="file-input" multiple style="display:none" />
            </label>
          </div>
        </div>
        <ul id="file-list" class="file-list"></ul>
      </div>

      <div class="field">
        <button id="save-btn" class="btn btn-primary btn-full">Save Clip</button>
        <div id="save-msg" class="save-msg"></div>
      </div>
    </div>

    <!-- Right: Recent clips -->
    <div class="panel right-panel">
      <div class="section">
        <h2 class="panel-title">Recent Clips</h2>
        <div id="clips-list" class="clips-list">
          <div class="empty-state">No clips yet.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Login -->
  <div id="loginOverlay">
    <div id="loginCard">
      <h2>Work Clip Board</h2>
      <p id="loginError" class="login-error" style="display:none"></p>
      <div class="login-field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="login-field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" />
      </div>
      <button id="loginBtn" class="btn btn-primary" style="width:100%">Sign In</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="clip.js"></script>
</body>
</html>
